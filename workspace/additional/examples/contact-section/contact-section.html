<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Variant 02</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0A0A0F;
      --bg-2:          #0D0D14;
      --surface:       #13131A;
      --surface-2:     #1A1A26;
      --border:        #1E1E2E;
      --border-strong: #2A2A3E;
      --text-h:        #F0F0FF;
      --text-b:        #A0A0B8;
      --text-m:        #505068;
      --accent:        #F59E0B;
      --accent-hover:  #FBBF24;
      --amber-glow:    rgba(245,158,11,0.18);
      --amber-glow-sm: rgba(245,158,11,0.08);
      --amber-border:  rgba(245,158,11,0.22);
      --amber-surface: rgba(245,158,11,0.05);
      --green:         #22C55E;
      --font: 'Space Grotesk', sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text-h); overflow-x: hidden; }

    /* ── SHARED ── */
    section {
      min-height: 100svh;
      position: relative; padding: 100px 64px;
      overflow: hidden; display: flex;
      flex-direction: column; justify-content: center;
    }

    .variant-label {
      position: absolute; top: 32px; left: 64px;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-m);
      display: flex; align-items: center; gap: 10px;
    }
    .variant-label::before {
      content: ''; width: 24px; height: 1px; background: var(--border-strong);
    }

    .eyebrow {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent);
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    .eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--accent); opacity: 0.5; }

    .section-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800; letter-spacing: -0.03em;
      line-height: 1.1; color: var(--text-h); margin-bottom: 12px;
    }
    .section-title span { color: var(--accent); }
    .section-desc { font-size: 0.9rem; line-height: 1.75; color: var(--text-b); max-width: 440px; }

    /* ── FORM ELEMENTS ── */
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-label {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-m);
    }
    .form-input, .form-textarea {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 13px 16px;
      font-family: var(--font); font-size: 0.88rem;
      color: var(--text-h); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-m); }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--amber-border);
      box-shadow: 0 0 0 3px var(--amber-glow-sm);
    }
    .form-textarea { resize: none; min-height: 120px; line-height: 1.6; }

    /* ── BUTTONS ── */
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #0A0A0F;
      font-family: var(--font); font-size: 0.85rem; font-weight: 700;
      letter-spacing: 0.02em; padding: 14px 28px;
      border-radius: 8px; border: none; cursor: pointer;
      transition: all 0.25s var(--ease); text-decoration: none;
      width: 100%;
    }
    .btn-primary:hover {
      background: var(--accent-hover); transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--amber-glow);
    }

    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: transparent; color: var(--text-b);
      font-family: var(--font); font-size: 0.85rem; font-weight: 600;
      padding: 14px 28px; border-radius: 8px;
      border: 1px solid var(--border); cursor: pointer;
      transition: all 0.25s var(--ease); text-decoration: none;
      width: 100%;
    }
    .btn-outline:hover {
      border-color: var(--amber-border); color: var(--text-h);
      background: var(--amber-surface);
    }

    .btn-whatsapp {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: #25D366; color: #fff;
      font-family: var(--font); font-size: 0.85rem; font-weight: 700;
      padding: 14px 28px; border-radius: 8px;
      border: none; cursor: pointer;
      transition: all 0.25s var(--ease); text-decoration: none;
      width: 100%;
    }
    .btn-whatsapp:hover { background: #1ebe5c; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,211,102,0.25); }

    /* contact chips */
    .contact-chip {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 10px 18px;
      font-size: 0.82rem; color: var(--text-b);
      text-decoration: none; transition: all 0.2s;
    }
    .contact-chip:hover { border-color: var(--amber-border); color: var(--text-h); background: var(--amber-surface); }
    .contact-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

    /* ── SUCCESS STATE ── */
    .success-msg {
      display: none; align-items: center; gap: 12px;
      background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2);
      border-radius: 8px; padding: 14px 18px;
      font-size: 0.85rem; color: var(--green);
    }
    .success-msg.show { display: flex; }

    /* ══════════════════════════════════════
       VARIANT 2 — Centered Minimal
    ══════════════════════════════════════ */
    #v2 { background: var(--bg-2); align-items: center; text-align: center; }

    .v2-inner { max-width: 560px; width: 100%; }
    .v2-inner .eyebrow { justify-content: center; }
    .v2-inner .eyebrow::before { display: none; }

    .v2-form { display: flex; flex-direction: column; gap: 14px; margin-top: 40px; text-align: left; }

    .v2-or {
      display: flex; align-items: center; gap: 12px;
      color: var(--text-m); font-size: 0.75rem; margin: 4px 0;
    }
    .v2-or::before, .v2-or::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .v2-direct-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .v2-chips {
      display: flex; justify-content: center; gap: 10px;
      flex-wrap: wrap; margin-top: 24px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      section { padding: 80px 24px; }
      .variant-label { left: 24px; }
      .v2-direct-btns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ══ VARIANT 2 — Centered Minimal ══ -->
<section id="v2">
  <span class="variant-label">Variant 02 — Centered Minimal</span>

  <div class="v2-inner">
    <div class="eyebrow">Contact</div>
    <h2 class="section-title">Let's build something <span>real</span></h2>
    <p class="section-desc" style="margin: 12px auto 0; text-align:center">Have a project? I respond within 24 hours.</p>

    <form class="v2-form" onsubmit="handleSubmit(event,'v2-success')">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" type="text" placeholder="Your name" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" placeholder="your@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-textarea" placeholder="Tell me about your project..."></textarea>
      </div>
      <div class="success-msg" id="v2-success">✓ Message sent! I'll get back to you within 24h.</div>
      <button type="submit" class="btn-primary">Send Message →</button>
    </form>

    <div class="v2-or">or reach out directly</div>

    <div class="v2-direct-btns">
      <a href="mailto:[your@email.com]" class="btn-outline">✉️ Email Me</a>
      <a href="https://wa.me/[your-number]" class="btn-whatsapp" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
    </div>

    <div class="v2-chips">
      <span class="contact-chip"><span class="contact-chip-dot"></span> Available for projects</span>
      <span class="contact-chip">⚡ Replies within 24h</span>
    </div>
  </div>
</section>

<script>
  function handleSubmit(e, successId) {
    e.preventDefault();
    const msg = document.getElementById(successId);
    msg.classList.add('show');
    e.target.reset();
    setTimeout(() => msg.classList.remove('show'), 4000);
  }
</script>

</body>
</html>
