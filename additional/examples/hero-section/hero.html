<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aamer — Hero Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --border:   rgba(255,255,255,0.07);
      --text:     #f0f0f0;
      --muted:    #555;
      --muted-2:  #333;
      --accent:   #e8ff47;
      --accent-2: #ff6b35;
      --font-display: 'Syne', sans-serif;
      --font-mono:    'DM Mono', monospace;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg:      #f5f4f0;
      --border:  rgba(0,0,0,0.07);
      --text:    #111111;
      --muted:   #999;
      --muted-2: #ddd;
    }

    html, body {
      font-family: var(--font-display);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
      overflow-x: hidden;
    }

    /* ─── NOISE OVERLAY ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── HERO ────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 40px 56px;
      overflow: hidden;
    }

    /* Subtle grid background */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 40%, black 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 100%, transparent 40%, black 100%);
      pointer-events: none;
      z-index: 0;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* Tag */
    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.6s var(--ease) 0.1s forwards;
    }

    .hero-tag-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    /* Headline */
    .hero-headline {
      font-size: clamp(3.2rem, 10vw, 9rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.95;
      margin-bottom: 40px;
    }

    .hero-headline .line {
      display: block;
      overflow: hidden;
    }

    .hero-headline .line-inner {
      display: block;
      opacity: 0;
      transform: translateY(100%);
      animation: slideUp 0.7s var(--ease) forwards;
    }

    .hero-headline .line:nth-child(1) .line-inner { animation-delay: 0.2s; }
    .hero-headline .line:nth-child(2) .line-inner { animation-delay: 0.32s; }
    .hero-headline .line:nth-child(3) .line-inner { animation-delay: 0.44s; }

    .hero-headline .outlined {
      -webkit-text-stroke: 1.5px var(--text);
      color: transparent;
      transition: color 0.3s var(--ease), -webkit-text-stroke 0.3s var(--ease);
    }

    [data-theme="light"] .hero-headline .outlined {
      -webkit-text-stroke: 1.5px var(--text);
    }

    /* Bottom row */
    .hero-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s var(--ease) 0.7s forwards;
    }

    /* Description + CTAs */
    .hero-left {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 480px;
    }

    .hero-desc {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.8;
      color: var(--muted);
      max-width: 360px;
    }

    .hero-ctas {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--text);
      color: var(--bg);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 12px 24px;
      border-radius: 6px;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .btn-primary:hover { opacity: 0.8; transform: translateY(-2px); }
    .btn-primary svg { transition: transform 0.3s var(--ease); }
    .btn-primary:hover svg { transform: translateX(3px); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      color: var(--muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 12px 0;
      border-radius: 6px;
      transition: color 0.3s var(--ease);
      border-bottom: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); }

    /* Stats */
    .hero-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 24px;
      flex-shrink: 0;
    }

    .stat {
      text-align: right;
    }

    .stat-number {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .stat-divider {
      width: 1px;
      height: 40px;
      background: var(--border);
      align-self: flex-end;
      margin-right: 8px;
      display: none;
    }

    /* Scroll indicator */
    .hero-scroll {
      position: absolute;
      bottom: 56px;
      right: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeUp 0.6s var(--ease) 1s forwards;
      z-index: 1;
    }

    .hero-scroll span {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      writing-mode: vertical-rl;
    }

    .scroll-line {
      width: 1px;
      height: 48px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .scroll-line::after {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--muted);
      animation: scrollDrop 1.8s ease infinite 1.2s;
    }

    @keyframes scrollDrop {
      0%   { top: -100%; }
      100% { top: 100%; }
    }

    /* Animations */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 768px) {
      .hero {
        padding: 0 20px 48px;
        justify-content: flex-end;
      }

      .hero-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 32px;
      }

      .hero-stats {
        flex-direction: row;
        align-items: flex-start;
        gap: 32px;
        width: 100%;
      }

      .stat { text-align: left; }

      .hero-scroll { display: none; }

      .hero-headline {
        margin-bottom: 32px;
      }
    }

    /* RTL */
    [data-lang="ar"] { direction: rtl; }
    [data-lang="ar"] .hero-stats { align-items: flex-start; }
    [data-lang="ar"] .stat { text-align: left; }
    [data-lang="ar"] .hero-scroll { right: auto; left: 40px; }
    [data-lang="ar"] .btn-primary svg { transform: rotate(180deg); }
    [data-lang="ar"] .btn-primary:hover svg { transform: rotate(180deg) translateX(3px); }
  </style>
</head>

<body>

  <section class="hero" id="home">

    <div class="hero-inner">

      <!-- Tag -->
      <p class="hero-tag">
        <span class="hero-tag-dot"></span>
        <span data-en="Full Stack Developer — Cairo, EG" data-ar="Full Stack Developer — القاهرة، مصر">Full Stack Developer — Cairo, EG</span>
      </p>

      <!-- Headline -->
      <h1 class="hero-headline">
        <span class="line">
          <span class="line-inner" data-en="I build" data-ar="بابني">I build</span>
        </span>
        <span class="line">
          <span class="line-inner outlined" data-en="full stack" data-ar="full stack">full stack</span>
        </span>
        <span class="line">
          <span class="line-inner" data-en="solutions." data-ar="solutions.">solutions.</span>
        </span>
      </h1>

      <!-- Bottom -->
      <div class="hero-bottom">

        <div class="hero-left">
          <p class="hero-desc" data-en="Clean code. Real results. Frontend to backend — I handle the full picture so you don't have to." data-ar="كود نظيف. نتايج حقيقية. من الـ frontend للـ backend — بشيل الصورة كاملة عشان متشغلش بالك.">
            Clean code. Real results. Frontend to backend — I handle the full picture so you don't have to.
          </p>
          <div class="hero-ctas">
            <a href="#work" class="btn-primary">
              <span data-en="See My Work" data-ar="شوف شغلي">See My Work</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
            <a href="#contact" class="btn-secondary">
              <span data-en="Let's Talk" data-ar="نتكلم">Let's Talk</span>
            </a>
          </div>
        </div>

        <div class="hero-stats">
          <div class="stat">
            <p class="stat-number">10+</p>
            <p class="stat-label" data-en="Projects" data-ar="مشروع">Projects</p>
          </div>
          <div class="stat">
            <p class="stat-number">100%</p>
            <p class="stat-label" data-en="On Time" data-ar="في الموعد">On Time</p>
          </div>
        </div>

      </div>
    </div>

    <!-- Scroll indicator -->
    <div class="hero-scroll" aria-hidden="true">
      <span data-en="scroll" data-ar="scroll">scroll</span>
      <div class="scroll-line"></div>
    </div>

  </section>

  <script>
    const t = localStorage.getItem('theme') || 'dark';
    const l = localStorage.getItem('lang')  || 'en';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l);
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute(`data-${l}`);
    });
  </script>

</body>
</html>
