<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>404 — Page Not Found | Amer Abdelfattah</title>
  <meta name="description" content="This page doesn't exist. Head back to Amer Abdelfattah's portfolio." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://amernextdev.pages.dev/" />

  <!-- Favicons -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <meta name="theme-color" content="#F59E0B" />

  <style>
    /* ── Design Tokens (mirrors main site) ── */
    :root {
      --color-bg:            #0a0a0f;
      --color-surface:       #13131a;
      --color-border:        #1e1e2e;
      --color-border-strong: #2a2a3e;
      --color-text-heading:  #f0f0ff;
      --color-text-body:     #a0a0b8;
      --color-text-muted:    #505068;
      --color-accent:        #f59e0b;
      --color-accent-hover:  #fbbf24;
      --color-accent-active: #d97706;
      --color-amber-surface: #f59e0b0f;
      --color-amber-border:  #f59e0b40;
      --color-amber-glow:    #f59e0b33;
      --shadow-amber-md:     0 0 24px #f59e0b33;

      --font-primary: "Syne", system-ui, -apple-system, sans-serif;
      --fw-regular: 400;
      --fw-semibold: 600;
      --fw-bold: 700;
      --fw-extrabold: 800;

      --radius-sm:   4px;
      --radius-full: 9999px;
      --transition-base: .25s ease;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ── */
    html { scroll-behavior: smooth; height: 100%; }

    body {
      font-family: var(--font-primary);
      background-color: var(--color-bg);
      color: var(--color-text-body);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      overflow: hidden;
    }

    /* ── Ambient glow background ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #f59e0b12 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, #f59e0b08 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Card wrapper ── */
    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      box-shadow: 0 16px 64px #000000b3, var(--shadow-amber-md);
      animation: card-in .55s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── 404 number ── */
    .error-code {
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: var(--fw-extrabold);
      line-height: 1;
      letter-spacing: -.04em;
      color: var(--color-accent);
      text-shadow: 0 0 48px #f59e0b59;
      margin-bottom: 0.5rem;
      user-select: none;
    }

    /* ── Label badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .7rem;
      font-weight: var(--fw-semibold);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--color-accent);
      background: var(--color-amber-surface);
      border: 1px solid var(--color-amber-border);
      border-radius: var(--radius-full);
      padding: .25rem 1rem .25rem .75rem;
      margin-bottom: 1.5rem;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent);
      flex-shrink: 0;
    }

    /* ── Heading ── */
    h1 {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: var(--fw-bold);
      color: var(--color-text-heading);
      line-height: 1.25;
      margin-bottom: .75rem;
      letter-spacing: -.02em;
    }

    /* ── Description ── */
    p {
      font-size: .9375rem;
      line-height: 1.65;
      color: var(--color-text-body);
      max-width: 38ch;
      margin-inline: auto;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
      border-radius: var(--radius-full);
      margin: 1.75rem auto;
    }

    /* ── CTA button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--color-accent);
      color: #0a0a0f;
      font-family: var(--font-primary);
      font-size: .875rem;
      font-weight: var(--fw-bold);
      letter-spacing: .02em;
      padding: .75rem 1.75rem;
      border-radius: var(--radius-sm);
      border: 2px solid var(--color-accent);
      text-decoration: none;
      transition: background var(--transition-base), border-color var(--transition-base), transform var(--transition-base);
      margin-top: 1.75rem;
    }

    .btn:hover {
      background: var(--color-accent-active);
      border-color: var(--color-accent-active);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── Footer note ── */
    .footer-note {
      margin-top: 2.5rem;
      font-size: .8rem;
      color: var(--color-text-muted);
      position: relative;
      z-index: 1;
    }

    .footer-note a {
      color: var(--color-text-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color var(--transition-base);
    }

    .footer-note a:hover { color: var(--color-accent); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 2.25rem 1.5rem; }
    }
  </style>
</head>
<body>

  <main class="card" role="main">
    <div class="error-code" aria-label="Error 404">404</div>

    <span class="badge">Page Not Found</span>

    <h1>This page doesn't exist.</h1>

    <p>You might have followed a broken link, mistyped the URL, or landed somewhere that's been moved.</p>

    <div class="divider" aria-hidden="true"></div>

    <p>No worries — head back and explore the portfolio.</p>

    <a href="/" class="btn">
      <svg viewBox="0 0 448 512" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0 105.4-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/>
      </svg>
      Back to Homepage
    </a>
  </main>

  <p class="footer-note">
    &copy; 2026 Amer Abdelfattah &nbsp;&mdash;&nbsp;
    <a href="mailto:amernext.dev@gmail.com">amernext.dev@gmail.com</a>
  </p>

</body>
</html>
